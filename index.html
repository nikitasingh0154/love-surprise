
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #48001f, #10000a, #000);
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            text-align: center;
            z-index: 2;
        }

        .heart {
            font-size: 150px;
            color: #ff1744;
            animation: heartbeat 1.2s infinite;
            filter: drop-shadow(0 0 20px #ff1744);
            cursor: pointer;
        }

        h1 {
            font-size: 42px;
            color: #fff;
            text-shadow: 0 0 10px #ff1744,
                         0 0 25px #ff1744;
            animation: glow 2s infinite alternate;
        }

        .message {
            margin-top: 20px;
            font-size: 22px;
            color: #ffb6d5;
            letter-spacing: 2px;
        }

        .hint {
            margin-top: 25px;
            font-size: 14px;
            color: #ffc1dc;
        }

        .floating-heart {
            position: absolute;
            bottom: -40px;
            color: #ff2d75;
            animation: floatUp linear forwards;
            pointer-events: none;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #ff1744;
            }
            to {
                text-shadow: 0 0 30px #ff1744,
                             0 0 50px #ff69b4;
            }
        }

        @keyframes floatUp {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="heart" id="heart">❤️</div>

        <h1 id="title">I Love You</h1>

        <p class="message">Forever and Always 💕</p>

        <p class="hint">Click the heart for more love ❤️</p>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement("div");

            heart.className = "floating-heart";
            heart.innerHTML = Math.random() > 0.5 ? "❤️" : "💕";

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = (15 + Math.random() * 25) + "px";
            heart.style.animationDuration = (3 + Math.random() * 4) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        setInterval(createHeart, 250);

        document.getElementById("heart").addEventListener("click", () => {
            const title = document.getElementById("title");
            title.innerHTML = "I Love You So Much ❤️";

            for (let i = 0; i < 20; i++) {
                setTimeout(createHeart, i * 80);
            }
        });
    </script>

</body>
</html>
